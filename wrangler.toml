name = "mark"
main = "worker/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Static Assets (Vite SPA Frontend)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "markbel-db"
database_id = "2dd655d0-8119-43fa-ad51-5e466d6bdb7f"

