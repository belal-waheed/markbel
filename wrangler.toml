name = "markbel-api"
main = "worker/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "markbel-db"
database_id = "xxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
migrations_dir = "worker/migrations"

# Cloudflare KV Namespace Binding (Optional Session Cache)
# [[kv_namespaces]]
# binding = "KV_AUTH"
# id = "xxxxxx"

[vars]
JWT_SECRET = "markbel-production-jwt-secret-replace-with-secret"

# Cloudflare Pages build output configuration
[site]
bucket = "./dist"
