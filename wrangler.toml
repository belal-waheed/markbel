name = "mark"
main = "worker/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Static Assets (Vite SPA Frontend)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "markbel-db"
database_id = "2dd655d0-8119-43fa-ad51-5e466d6bdb7f"

# Cloudflare Email Service Binding
[[send_email]]
name = "Mail_Pass"

# Optional Upstash Redis & QStash configuration:
# Run: npx wrangler secret put UPSTASH_REDIS_REST_URL
# Run: npx wrangler secret put UPSTASH_REDIS_REST_TOKEN
# Run: npx wrangler secret put QSTASH_TOKEN
# Run: npx wrangler secret put QSTASH_CURRENT_SIGNING_KEY
# Run: npx wrangler secret put CRON_SECRET
# Run: npx wrangler secret put VAPID_PUBLIC_KEY
# Run: npx wrangler secret put VAPID_PRIVATE_KEY

